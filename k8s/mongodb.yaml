apiVersion: mongodb.com/v1
kind: MongoDB
metadata:
  name: mongodb
spec:
  members: 1
  type: ReplicaSet
  version: 6.0.10
  security:
    authentication:
      modes: ["SCRAM"]
  users:
    - name: admin
      db: admin
      roles:
        - name: root
          db: admin
      scramCredentialsSecret: mongodb-admin-credentials
  statefulSet:
    spec:
      resources:
        requests:
          memory: "1Gi"
          cpu: "0.5"
        limits:
          memory: "2Gi"
          cpu: "1"
  backup:
    enabled: false
